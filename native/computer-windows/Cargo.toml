[package]
name = "lrmcp-computer-worker"
version = "6.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
windows-capture = "2.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
