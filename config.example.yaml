## Copy this file to local-runtime-mcp.yaml beside lrmcp.
##
## Unified architecture (v18.0.0 — 4-primitive stateful JS runtime + browser-level CDP):
##   lrmcp setup local                         # initialize 127.0.0.1:9317 local plane
##   lrmcp setup browser                       # initialize 127.0.0.1:9315 browser extension bridge
##   lrmcp serve --transport stdio             # pure thin proxy; auto-spawns detached daemon
##   lrmcp start | stop | status               # manage background user-session daemon
##   lrmcp ui                                  # open local-only Sovereign Activity Studio (/ui)
##   lrmcp audit list | search | tail | export # query or stream embedded SQLite WAL + FTS5 audit log
##   lrmcp tunnel up openai [--ttl 2h]         # hot-plug OpenAI wire live (0 daemon restart)
##   lrmcp tunnel up cloudflare [--ttl 2h]     # hot-plug Cloudflare wire live (0 daemon restart)
##   lrmcp tunnel down openai | cloudflare | all
##   lrmcp grant remote openai --read-only     # live-restrict a remote wire to read-only tools
##   lrmcp setup remote-token --id worker-1    # mint named Bearer token on 9316 (coexists with OAuth)

# Browser-level CDP (auto-discovers Edge/Chrome DevToolsActivePort) + slim extension bridge (Web Bridge, L panel, Tab Groups)
browser:
  listen: 127.0.0.1:9315
  token: "replace-with-a-random-token-of-at-least-32-characters"
  # Optional explicit CDP endpoints (ws://... or http://127.0.0.1:9222):
  # cdp_endpoints: []
  # disable_auto_cdp: false

# Local-only control & MCP plane (loopback only, never tunneled, rejects Origin & proxy headers)
# Serves same-host /mcp (with LocalApps & stdio thin-proxy attach), /admin/*, and /capabilities/*
local:
  listen: 127.0.0.1:9317
  # Generate with: lrmcp setup local
  token: "replace-with-a-different-random-local-token-at-least-32-characters"

# Hot-pluggable public / tunnel-facing MCP gateway (never serves /admin or LocalApps)
http:
  listen: 127.0.0.1:9316
  public_host: mcp.example.com
  auth: bearer
  bearer_token: "replace-with-a-random-token-of-at-least-32-characters"
  # For an OAuth client, run:
  # lrmcp setup oauth --client-name gemini --redirect-uri "https://client.example.com/callback"
  # Setup selects auth: oauth and creates owner_token plus registered clients.
  # oauth:
  #   owner_token: "generated-owner-approval-key"
  #   clients:
  #     - client_id: gemini
  #       client_secret: "generated-client-secret"
  #       redirect_uris:
  #         - "https://client.example.com/callback"

openai:
  tunnel_id: "replace-with-your-openai-tunnel-id"
  api_key: "replace-with-your-openai-tunnel-api-key"

cloudflare:
  tunnel_token: "replace-with-your-cloudflare-managed-tunnel-token"

# Distilled Web MCP tools (same-named JSON + JS pairs) and App MCP bindings (JSON command files).
# Relative paths resolve beside this configuration, not the launch directory.
capabilities:
  directory: capabilities

# Unified owner grants across websites, same-computer native clients, and remote wires.
grants:
  # Browser websites authenticate through the extension's real top-level Origin (zero page secrets).
  # The extension's toolbar L panel edits this list live.
  web:
    - site: https://hicancan.top
      use: true
      # capabilities:
      #   icourse.outline: "https://www.icourse163.org/learn/COURSE#/learn/content"
      # tools:
      #   - browser_status
    - site: https://icourse163.org
      provide: true
  # Same-computer native clients authenticate on 127.0.0.1:9317 with one scoped token each.
  # Generate with: lrmcp setup client --id studev-win
  # clients:
  #   - id: studev-win
  #     token: "replace-with-a-separate-random-token-of-at-least-32-characters"
  #     browser_id: "owner-selected-profile-id" # Optional when one profile is online.
  #     capabilities:
  #       icourse.outline: "https://www.icourse163.org/learn/COURSE#/learn/content"
  # Optional per-wire remote boundaries (empty allows the full remote-safe surface, never LocalApps).
  # Named remote tokens under `tokens` allow multiple cloud clients to share 127.0.0.1:9316 (Cloudflare)
  # concurrently with independent attribution and optional read-only/tool limits — even when http.auth is oauth!
  # remote:
  #   openai:
  #     read_only: false
  #   http:
  #     read_only: false
  #   tokens:
  #     - id: worker-1
  #       token: "replace-with-a-separate-random-token-of-at-least-32-characters"
  #       read_only: false
