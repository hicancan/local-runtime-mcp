## Copy this file to local-runtime-mcp.yaml beside lrmcp.
## Choose entry points explicitly, for example:
## lrmcp serve --transport http --tunnel openai --tunnel cloudflare

browser:
  listen: 127.0.0.1:9315
  token: "replace-with-a-random-token-of-at-least-32-characters"

openai:
  tunnel_id: "replace-with-your-openai-tunnel-id"
  api_key: "replace-with-your-openai-tunnel-api-key"

http:
  listen: 127.0.0.1:9316
  public_host: mcp.example.com
  auth: bearer
  bearer_token: "replace-with-a-random-token-of-at-least-32-characters"
  # For an OAuth client, run:
  # lrmcp setup oauth --client-name gemini --redirect-uri "https://client.example.com/callback"
  # Setup selects auth: oauth and creates owner_token plus registered clients.
  # oauth:
  #   owner_token: "generated-owner-approval-key"
  #   clients:
  #     - client_id: gemini
  #       client_secret: "generated-client-secret"
  #       redirect_uris:
  #         - "https://client.example.com/callback"

cloudflare:
  tunnel_token: "replace-with-your-cloudflare-managed-tunnel-token"

# Registered tools are same-named JSON + JS pairs in this file tree.
# Relative paths resolve beside this configuration, not the launch directory.
capabilities:
  directory: capabilities
  web:
    - origin: https://studev.hicancan.top
      models: [deepseek-web]
      # Generic page tools can be granted separately, at owner-fixed target URLs:
      # capabilities:
      #   example.read: https://example.com/account
      #   icourse.outline: "https://www.icourse163.org/learn/COURSE#/learn/content"
  # Opt in when serving HTTP, for a native app on the same computer only.
  # Grant targets come from the origin above. Only read-only tools are listed.
  # native:
  #   listen: 127.0.0.1:9317
  #   key: "replace-with-a-separate-random-key-of-at-least-32-characters"
  #        # Or set LOCAL_RUNTIME_MCP_NATIVE_CAPABILITY_KEY when starting lrmcp.
  #   origin: https://studev.hicancan.top
  #   browser_id: "owner-selected-profile-id" # Optional if one profile is online.

# Only enable models you want to serve. This key grants model use only, never MCP.
# LOCAL_RUNTIME_MCP_MODEL_KEY can supply it to one child process instead of YAML.
models:
  key: "replace-with-a-different-random-model-key-at-least-32-characters"
  items:
    - id: deepseek-web
      title: DeepSeek 网页
      url: https://chat.deepseek.com/
      start: deepseek.start
      read: deepseek.read
      stop: deepseek.stop
      timeout_seconds: 300
