name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true
      - run: go test ./...
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          LRMCP_BROWSER_E2E: '1'
        run: go test ./internal/browser -run TestEdgeExtensionEndToEnd -count=3 -v
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/lrmcp
