<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root { color-scheme: light dark; --ink: #1b1d20; --muted: #62666c; --faint: #9ba0a6; --line: #e2e7ef; --paper: #fff; --sunken: #edf1f6; --blue: #1f6feb; --green: #0e9f85; }
      @media (prefers-color-scheme: dark) { :root { --ink: #eceef0; --muted: #a3a8ae; --faint: #6b7076; --line: #30363e; --paper: #121416; --sunken: #0f1216; --blue: #5b9bff; --green: #3bd8bb; } }
      body { width: 340px; margin: 0; font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--paper); }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
      header img { width: 28px; height: 28px; }
      header b { display: block; font-size: 14px; }
      header small { color: var(--muted); }
      header small.off { color: #e5484d; }
      header nav { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      header a, header button { color: var(--muted); font: inherit; font-size: 12px; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
      header a:hover, header button:hover { color: var(--ink); }
      .site small { color: var(--muted); font-weight: 400; }
      .site { margin: 0 16px 6px; padding: 8px 10px; border-radius: 10px; background: var(--sunken); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      section { margin: 8px 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      section > label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; font-weight: 600; }
      section > label .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      section > label .dot { background: var(--line); }
      section.uses .dot.on { background: var(--blue); } section.provides .dot.on { background: var(--green); } section.tunnels .dot.on { background: var(--green); }
      section > label input { margin-left: auto; }
      .hint { margin: -4px 12px 8px; color: var(--muted); font-size: 12px; }
      .group { padding: 4px 12px 8px; border-top: 1px solid var(--line); }
      .group h4 { margin: 6px 0 2px; color: var(--faint); font-size: 11.5px; font-weight: 500; }
      .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
      .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row input { flex: none; }
      section.uses input { accent-color: var(--blue); } section.provides input, section.tunnels input { accent-color: var(--green); }
      .wire-item { padding: 5px 0; border-top: 1px dashed var(--line); }
      .wire-item:first-child { border-top: 0; }
      .wire-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
      .wire-name { flex: 1; }
      .wire-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
      .wire-dot.active { background: var(--green); }
      .wire-dot.err { background: #e5484d; }
      .wire-sub { display: flex; align-items: center; gap: 6px; margin: 2px 0 0 15px; color: var(--muted); font-size: 11.5px; cursor: pointer; }
      .wire-err { margin: 3px 0 0 15px; color: #e5484d; font-size: 11px; word-break: break-word; }
      .stop-desktop { display: block; width: calc(100% - 24px); margin: 4px 12px 8px; padding: 7px 12px; border: 0; border-radius: 9px; background: #e5484d; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .empty { padding: 8px 12px 10px; color: var(--muted); font-size: 12px; }
      .proposal { padding: 8px 0 10px; border-top: 1px dashed var(--line); }
      .proposal:first-of-type { border-top: 0; }
      .proposal-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .proposal p { margin: 4px 0; color: var(--muted); font-size: 12px; }
      .effect { padding: 0 5px; border-radius: 5px; background: var(--sunken); color: var(--muted); font-size: 11px; }
      .effect.writes { color: #b45309; }
      .code summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      .code pre { max-height: 160px; overflow: auto; margin: 4px 0; padding: 6px; border-radius: 6px; background: var(--sunken); font-size: 11px; white-space: pre-wrap; }
      .proposal-actions { display: flex; gap: 8px; margin-top: 6px; }
      .proposal-actions button { padding: 4px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
      .proposal-actions .approve { background: var(--green); border-color: var(--green); color: #fff; }
      #status { min-height: 18px; margin: 4px 16px 12px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon-48.png" alt=""><div><b data-i18n="extName"></b><small id="connection"></small></div><nav><button id="studio" type="button" data-i18n="openStudio" hidden></button><button id="language" type="button"></button><a id="settings" href="#" data-i18n="openSettings"></a></nav></header>
    <div class="site" id="site"></div>
    <main id="panel"></main>
    <div id="status" role="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
